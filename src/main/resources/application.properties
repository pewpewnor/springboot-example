# PostgreSQL configuration (key names are from Spring)
spring.datasource.url=jdbc:postgresql://localhost:5432/springboot-example
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration (key names are presets from Jakarta)
spring.jpa.database=POSTGRESQL
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka configuration
kafka.bootstrap-servers=localhost:9092
kafka.new-topics=posts,examples

# MongoDB configuration
mongodb.url=mongodb://localhost:27017
mongodb.database-name=springboot-example

# Redis configuration
spring.redis.type=redis
spring.redis.host=localhost
spring.redis.port=6379
